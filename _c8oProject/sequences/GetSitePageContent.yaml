accessibility: Private
authenticatedContextRequired: true
comment: 'Reads a modern page of a SharePoint site (its home page by default) and turns it into sections, columns and blocks (text, image, links, list, news of the site, activity as its default library, divider), each column also given as one clean HTML fragment (a list of tags and attributes kept, no style, script nor event); the images of the site are read by Graph and inlined (data:) under maxImageBytes; the web parts it does not turn (events...) and the empty news are listed in skipped. With sharePointAccessToken (a token of the host of the site), the logo of the site too, by its REST API. (Graph permissions Sites.Read.All|Sites.ReadWrite.All; SharePoint AllSites.Read for the logo)'
↓inputVars [steps.InputVariablesStep-1799700002120]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteGetSitePageContent [steps.SimpleStep-1799700002121]: 
  comment: Chooses the page, reads its canvas layout and turns its web parts into blocks.
  expression: |
    'include("js/sharepoint_graph_common.js");
    include("js/sharepoint_page_content.js");
    
    var graphOperation = "site_page_content";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var site = gs_isBlank(siteId) ? gs_resolveSite(tokenInfo.token, "", siteHostname, sitePath).siteId : String(siteId);
    	var limitImages = gs_parseInteger("maxImages", maxImages, GS_PAGE_MAX_IMAGES);
    	var limitBytes = gs_parseInteger("maxImageBytes", maxImageBytes, GS_PAGE_MAX_IMAGE_BYTES);
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, gs_pageContent(tokenInfo.token, site, {
    		pageId: gs_safeString(pageId),
    		pageName: gs_safeString(pageName),
    		embedImages: gs_toBoolean(embedImages, true),
    		maxImages: limitImages < 0 ? 0 : (limitImages > 50 ? 50 : limitImages),
    		maxImageBytes: limitBytes < 1 ? GS_PAGE_MAX_IMAGE_BYTES : (limitBytes > 5000000 ? 5000000 : limitBytes),
    		sharePointToken: gs_safeString(sharePointAccessToken)
    	}));
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }
    json = gs_toBoolean(jsonOutput, false) ? JSON.stringify(response) : null;'
