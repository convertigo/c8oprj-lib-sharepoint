accessibility: Private
authenticatedContextRequired: true
comment: 'Lists the column definitions of a SharePoint list (GET /sites/{site}/lists/{list}/columns) as Microsoft Graph gives them: type facets, choices, lookups, hidden and read-only columns. Microsoft Graph only. (Graph permissions Sites.Read.All|Sites.ReadWrite.All)'
↓inputVars [steps.InputVariablesStep-1799700000031]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteListGetColumns [steps.SimpleStep-1799700000032]: 
  comment: 'Calls GET /columns of the list and follows its pages up to maxPages; with completeTypes, the columns Graph gives without type get one from their name or the values of the first items.'
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "list_columns";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var limitPages = gs_parseInteger("maxPages", maxPages, 5);
    	if (limitPages < 1) {
    		limitPages = 1;
    	}
    	if (limitPages > 20) {
    		limitPages = 20;
    	}
    	var resolved = gs_siteAndList(tokenInfo.token, siteId, siteHostname, sitePath, listId, listName, gs_toBoolean(describeList, true));
    	var requestInfo = gs_graphSiteListColumnsGetRequestInfo(tokenInfo.token, resolved.siteId, resolved.listId);
    	var pageResult = gs_graphCollectPagedValues(gs_requestInfoUrl(requestInfo), tokenInfo.token, limitPages);
    	var types = gs_toBoolean(completeTypes, false) ? gs_completeColumnTypes(tokenInfo.token, gs_requestInfoUrl(requestInfo), pageResult.values, limitPages) : null;
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		siteId: resolved.siteId,
    		listId: resolved.listId,
    		listName: resolved.listName,
    		listDisplayName: resolved.listDisplayName,
    		listWebUrl: resolved.listWebUrl,
    		count: pageResult.values.length,
    		pagesFetched: pageResult.pagesFetched,
    		hasMore: !gs_isBlank(pageResult.nextLink),
    		typesMissing: types === null ? 0 : types.missing,
    		typesCompleted: types === null ? 0 : types.completed,
    		typesError: types === null ? "" : types.error,
    		columns: pageResult.values
    	});
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }
    json = gs_toBoolean(jsonOutput, false) ? JSON.stringify(response) : null;'
