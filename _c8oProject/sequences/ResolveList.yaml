↓ExecuteResolveList [steps.SimpleStep-1772620734451]: 
  comment: Resolves site and list identifiers through Microsoft Graph (online) or SharePoint REST (on-prem).
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "resolve_list";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremResolveList({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			listId: listId,
    			listName: listName,
    			accessToken: accessToken,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    		var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		tokenMode = tokenInfo.mode;
    
    		var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    		var normalizedList = gs_resolveList(tokenInfo.token, resolvedSite.siteId, listId, listName);
    
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			siteId: resolvedSite.siteId,
    			siteHostname: resolvedSite.siteHostname,
    			sitePath: resolvedSite.sitePath,
    			listId: normalizedList.listId,
    			listName: normalizedList.listName,
    			listDisplayName: normalizedList.listDisplayName,
    			webUrl: normalizedList.listWebUrl,
    			createdDateTime: normalizedList.createdDateTime,
    			lastModifiedDateTime: normalizedList.lastModifiedDateTime,
    			listInfo: normalizedList.listInfo,
    			sharepointIds: normalizedList.sharepointIds,
    			tokenPreview: tokenInfo.token.length > 20 ? tokenInfo.token.substring(0, 20) + "..." : tokenInfo.token
    		});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
