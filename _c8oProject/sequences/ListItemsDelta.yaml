↓ExecuteListDriveItemsDelta [steps.SimpleStep-1772719781583]: 
  comment: Resolves site and drive, then calls root/item delta endpoint with optional token or deltaLink.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "list_drive_items_delta";
    var requiredPermission = "Files.Read.All|Files.ReadWrite.All|Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremListDriveItemsDelta({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			driveId: driveId,
    			driveName: driveName,
    			listId: listId,
    			listName: listName,
    			parentItemId: parentItemId,
    			deltaToken: deltaToken,
    			deltaLink: deltaLink,
    			top: top,
    			maxPages: maxPages,
    			selectFields: selectFields,
    			includeRawItem: includeRawItem,
    			accessToken: accessToken,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    tokenMode = tokenInfo.mode;
    
    var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    var resolvedDriveData = gs_resolveDrive(tokenInfo.token, resolvedSite, driveId, driveName, listId, listName);
    var resolvedDrive = resolvedDriveData.drive;
    var resolvedList = resolvedDriveData.list;
    
    var parent = gs_safeString(parentItemId);
    if (gs_isBlank(parent)) {
    	parent = "root";
    }
    var pageTop = gs_parseInteger("top", top, 200);
    if (pageTop < 1) {
    	throw new java.lang.IllegalArgumentException("top must be >= 1");
    }
    var limitPages = gs_parseInteger("maxPages", maxPages, 20);
    if (limitPages < 1) {
    	throw new java.lang.IllegalArgumentException("maxPages must be >= 1");
    }
    var includeRaw = gs_toBoolean(includeRawItem, false);
    
    var fields = gs_splitCsv(selectFields);
    if (fields.length === 0) {
    	fields = ["id", "name", "webUrl", "size", "eTag", "cTag", "createdDateTime", "lastModifiedDateTime", "file", "folder", "parentReference", "fileSystemInfo", "shared", "sharepointIds", "@removed"];
    }
    
    	var nextLink = gs_safeString(deltaLink);
    	if (gs_isBlank(nextLink)) {
    		var requestInfo = gs_graphDriveItemDeltaRequestInfo(tokenInfo.token, gs_safeString(resolvedDrive.id), parent);
    		gs_graphAddQueryParameter(requestInfo, "$select", fields.join(","));
    		gs_graphAddQueryParameter(requestInfo, "$top", String(pageTop));
    		gs_graphAddQueryParameter(requestInfo, "token", gs_safeString(deltaToken));
    		nextLink = gs_requestInfoUrl(requestInfo);
    	}
    
    var items = [];
    var pageResult = gs_graphCollectPagedValues(nextLink, tokenInfo.token, limitPages);
    var values = pageResult.values;
    var pageCount = pageResult.pagesFetched;
    nextLink = pageResult.nextLink;
    var latestDeltaLink = pageResult.deltaLink;
    var i;
    for (i = 0; i < values.length; i++) {
    		items.push(gs_normalizeDriveItem(values[i], includeRaw));
    }
    
    response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    	siteId: resolvedSite.siteId,
    	siteHostname: resolvedSite.siteHostname,
    	sitePath: resolvedSite.sitePath,
    	driveId: gs_safeString(resolvedDrive.id),
    	driveName: gs_safeString(resolvedDrive.name),
    	driveWebUrl: gs_safeString(resolvedDrive.webUrl),
    	driveType: gs_safeString(resolvedDrive.driveType),
    	resolvedFromList: resolvedList !== null,
    	listId: resolvedList === null ? "" : resolvedList.listId,
    	listName: resolvedList === null ? "" : resolvedList.listName,
    	query: {
    		parentItemId: parent,
    		deltaToken: gs_safeString(deltaToken),
    		deltaLink: gs_safeString(deltaLink),
    		top: pageTop,
    		maxPages: limitPages,
    		selectFields: fields,
    		includeRawItem: includeRaw
    	},
    	pageCount: pageCount,
    	itemCount: items.length,
    	nextLink: nextLink,
    	deltaLink: latestDeltaLink,
    	items: items
    });
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
