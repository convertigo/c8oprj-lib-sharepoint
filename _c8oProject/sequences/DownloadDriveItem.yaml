accessibility: Private
authenticatedContextRequired: true
comment: 'Downloads a document of a library (a drive item) through Microsoft Graph (/drives/{driveId}/items/{itemId}/content, its redirection to the download URL followed without the token) into a file of its own under <java.io.tmpdir>/c8o-file-transfer, and answers its path: the caller deletes it once used. More than maxBytes: an error of httpStatus 413, nothing kept. (Graph permissions Sites.Read.All|Files.Read.All)'
↓inputVars [steps.InputVariablesStep-1799700002101]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteDownloadDriveItem [steps.SimpleStep-1799700002102]: 
  comment: Streams GET /drives/{driveId}/items/{itemId}/content into the transfer folder.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "download_drive_item";
    var requiredPermission = "Sites.Read.All|Files.Read.All";
    var tokenMode = "delegated";
    response = null;
    try {
    	var token = gs_require("accessToken", accessToken);
    	var limit = gs_parseInteger("maxBytes", maxBytes, GS_MAX_FILE_BYTES);
    	if (limit < 1 || limit > 1073741824) {
    		limit = GS_MAX_FILE_BYTES;
    	}
    	var file = gs_downloadToTransferFile(gs_graphDriveItemContentUrl(token, driveId, itemId), token, gs_isBlank(fileName) ? "document" : fileName, limit);
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, file);
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }
    json = gs_toBoolean(jsonOutput, false) ? JSON.stringify(response) : null;'
↓response [steps.JsonToXmlStep-1799700002103]: 
  comment: Converts the JS response object into XML output.
  jsonObject: 
    - xmlizable: 
