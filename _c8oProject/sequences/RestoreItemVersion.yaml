↓ExecuteRestoreDriveItemVersion [steps.SimpleStep-1772719795542]: 
  comment: Resolves site and drive then calls restoreVersion action on the selected version id.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "restore_drive_item_version";
    var requiredPermission = "Files.ReadWrite.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremRestoreDriveItemVersion({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			driveId: driveId,
    			driveName: driveName,
    			listId: listId,
    			listName: listName,
    			itemId: itemId,
    			versionId: versionId,
    			includeItemSnapshot: includeItemSnapshot,
    			includeRawItem: "false",
    			accessToken: accessToken,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    tokenMode = tokenInfo.mode;
    
    var targetItemId = gs_require("itemId", itemId);
    if (targetItemId.toLowerCase() === "root") {
    	throw new java.lang.IllegalArgumentException("Restore is available on file items, not root");
    }
    var targetVersionId = gs_require("versionId", versionId);
    var includeItemSnapshotFlag = gs_toBoolean(includeItemSnapshot, false);
    
    var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    var resolvedDriveData = gs_resolveDrive(tokenInfo.token, resolvedSite, driveId, driveName, listId, listName);
    var resolvedDrive = resolvedDriveData.drive;
    var resolvedList = resolvedDriveData.list;
    
    var restoreRequestInfo = gs_graphDriveItemVersionRestoreRequestInfo(tokenInfo.token, gs_safeString(resolvedDrive.id), targetItemId, targetVersionId);
    var restoreResult = gs_httpRequestInfoInternal(tokenInfo.token, restoreRequestInfo, null, null, "", "application/json", null, false);
    if (restoreResult.statusCode < 200 || restoreResult.statusCode >= 300) {
    	throw new java.lang.RuntimeException("Graph restoreVersion failed (" + restoreResult.statusCode + "): " + restoreResult.body);
    }
    
    var itemSnapshot = {};
    if (includeItemSnapshotFlag) {
    	var itemRequestInfo = gs_graphDriveItemGetRequestInfo(tokenInfo.token, gs_safeString(resolvedDrive.id), targetItemId);
    	gs_graphAddQueryParameter(itemRequestInfo, "$select", "id,name,webUrl,size,eTag,cTag,createdDateTime,lastModifiedDateTime,file,folder,parentReference,fileSystemInfo,shared,sharepointIds");
    	itemSnapshot = gs_graphGetJsonRequestInfo(itemRequestInfo, tokenInfo.token);
    }
    
    response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    	siteId: resolvedSite.siteId,
    	siteHostname: resolvedSite.siteHostname,
    	sitePath: resolvedSite.sitePath,
    	driveId: gs_safeString(resolvedDrive.id),
    	driveName: gs_safeString(resolvedDrive.name),
    	driveWebUrl: gs_safeString(resolvedDrive.webUrl),
    	resolvedFromList: resolvedList !== null,
    	listId: resolvedList === null ? "" : resolvedList.listId,
    	listName: resolvedList === null ? "" : resolvedList.listName,
    	itemId: targetItemId,
    	versionId: targetVersionId,
    	restoreRequest: {
    		statusCode: restoreResult.statusCode,
    		requestId: restoreResult.requestId,
    		clientRequestId: restoreResult.clientRequestId
    	},
    	itemSnapshot: itemSnapshot
    });
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
