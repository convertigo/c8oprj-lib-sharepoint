↓ExecuteDeleteDriveItem [steps.SimpleStep-1772719751948]: 
  comment: Resolves site and drive then deletes one drive item.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "delete_drive_item";
    var requiredPermission = "Files.ReadWrite.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremDeleteDriveItem({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			driveId: driveId,
    			driveName: driveName,
    			listId: listId,
    			listName: listName,
    			itemId: itemId,
    			includeDeletedItemSnapshot: includeDeletedItemSnapshot,
    			selectFields: selectFields,
    			includeRawItem: includeRawItem,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    
    	var targetItemId = gs_require("itemId", itemId);
    	if (String(targetItemId).toLowerCase() === "root") {
    		throw new java.lang.IllegalArgumentException("Deleting drive root is not allowed. Provide a child item id.");
    	}
    
    	var includeSnapshot = gs_toBoolean(includeDeletedItemSnapshot, false);
    	var includeRaw = gs_toBoolean(includeRawItem, false);
    	var selectedFields = gs_splitCsv(selectFields);
    
    	var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    	var resolvedDriveData = gs_resolveDrive(tokenInfo.token, resolvedSite, driveId, driveName, listId, listName);
    	var resolvedDrive = resolvedDriveData.drive;
    	var resolvedList = resolvedDriveData.list;
    
    	var snapshot = {};
    	if (includeSnapshot) {
    		var snapshotRequestInfo = gs_graphDriveItemGetRequestInfo(tokenInfo.token, resolvedDrive.driveId, targetItemId);
    		if (selectedFields.length > 0) {
    			gs_graphAddQueryParameter(snapshotRequestInfo, "$select", selectedFields.join(","));
    		}
    		snapshot = gs_normalizeDriveItem(gs_graphGetJsonRequestInfo(snapshotRequestInfo, tokenInfo.token), includeRaw);
    	}
    
    	var deleteRequestInfo = gs_graphDriveItemDeleteRequestInfo(tokenInfo.token, resolvedDrive.driveId, targetItemId);
    	var deleteResult = gs_graphDeleteRequestInfo(deleteRequestInfo, tokenInfo.token);
    
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		siteId: resolvedSite.siteId,
    		siteHostname: resolvedSite.siteHostname,
    		sitePath: resolvedSite.sitePath,
    		driveId: resolvedDrive.driveId,
    		driveName: resolvedDrive.driveName,
    		driveWebUrl: resolvedDrive.driveWebUrl,
    		driveType: resolvedDrive.driveType,
    		sharepointIds: resolvedDrive.sharepointIds,
    		quota: resolvedDrive.quota,
    		owner: resolvedDrive.owner,
    		resolvedFromList: resolvedList !== null,
    		listId: resolvedList === null ? "" : resolvedList.listId,
    		listName: resolvedList === null ? "" : resolvedList.listName,
    		listDisplayName: resolvedList === null ? "" : resolvedList.listDisplayName,
    		listWebUrl: resolvedList === null ? "" : resolvedList.listWebUrl,
    		listInfo: resolvedList === null ? {} : resolvedList.listInfo,
    		listSharepointIds: resolvedList === null ? {} : resolvedList.sharepointIds,
    		query: {
    			itemId: targetItemId,
    			includeDeletedItemSnapshot: includeSnapshot,
    			selectFields: selectedFields,
    			includeRawItem: includeRaw
    		},
    		deleted: deleteResult.statusCode === 204 || deleteResult.statusCode === 404,
    		deleteHttpStatus: deleteResult.statusCode,
    		item: includeSnapshot ? snapshot : {
    			itemId: String(targetItemId)
    		}
    	});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
