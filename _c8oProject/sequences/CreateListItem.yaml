↓ExecuteCreateListItem [steps.SimpleStep-1772620903002]: 
  comment: Resolves site and list then creates one list item through provider-specific API.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "create_list_item";
    var requiredPermission = "Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremCreateListItem({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			listId: listId,
    			listName: listName,
    			fieldsJson: fieldsJson,
    			returnCreatedItem: returnCreatedItem,
    			includeRawItem: includeRawItem,
    			accessToken: accessToken,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    		var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		tokenMode = tokenInfo.mode;
    
    		var includeRaw = gs_toBoolean(includeRawItem, false);
    		var shouldReturnCreatedItem = gs_toBoolean(returnCreatedItem, true);
    		var selectedFields = gs_splitCsv(selectFields);
    		var fieldsObject = gs_parseJsonObject("fieldsJson", fieldsJson);
    
    		var resolved = gs_resolveSiteAndList(
    			tokenInfo.token,
    			siteId,
    			siteHostname,
    			sitePath,
    			listId,
    			listName
    		);
    
    		var createPayload = {
    			fields: fieldsObject
    		};
    		if (!gs_isBlank(contentTypeId)) {
    			createPayload.contentType = {
    				id: String(contentTypeId)
    			};
    		}
    
    		var createRequestInfo = gs_graphSiteListItemsPostRequestInfo(tokenInfo.token, resolved.siteId, resolved.listId);
    		var createdObject = gs_graphPostJsonRequestInfo(createRequestInfo, tokenInfo.token, createPayload);
    		var createdItemId = gs_safeString(createdObject.id);
    		var createdItem = gs_normalizeItem(createdObject, includeRaw);
    
    		if (shouldReturnCreatedItem && !gs_isBlank(createdItemId)) {
    			var getRequestInfo = gs_graphSiteListItemGetRequestInfo(tokenInfo.token, resolved.siteId, resolved.listId, createdItemId);
    			var expandValue = "fields";
    			if (selectedFields.length > 0) {
    				expandValue = "fields($select=" + selectedFields.join(",") + ")";
    			}
    			gs_graphAddQueryParameter(getRequestInfo, "$expand", expandValue);
    			createdItem = gs_normalizeItem(gs_graphGetJsonRequestInfo(getRequestInfo, tokenInfo.token), includeRaw);
    		}
    
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			siteId: resolved.siteId,
    			siteHostname: resolved.siteHostname,
    			sitePath: resolved.sitePath,
    			listId: resolved.listId,
    			listName: resolved.listName,
    			listDisplayName: resolved.listDisplayName,
    			listWebUrl: resolved.listWebUrl,
    			sharepointIds: resolved.sharepointIds,
    			listInfo: resolved.listInfo,
    			query: {
    				returnCreatedItem: shouldReturnCreatedItem,
    				selectFields: selectedFields,
    				includeRawItem: includeRaw,
    				contentTypeId: gs_safeString(contentTypeId)
    			},
    			item: createdItem
    		});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
