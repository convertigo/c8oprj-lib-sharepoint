↓ExecuteDownloadDriveItemContent [steps.SimpleStep-1772719758921]: 
  comment: Resolves site and drive then downloads one drive item content.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "download_drive_item_content";
    var requiredPermission = "Files.Read.All|Files.ReadWrite.All|Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremDownloadDriveItemContent({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			driveId: driveId,
    			driveName: driveName,
    			listId: listId,
    			listName: listName,
    			itemId: itemId,
    			includeContentBase64: includeContentBase64,
    			includeMetadata: includeMetadata,
    			includeRawItem: includeRawItem,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    
    	var includeRaw = gs_toBoolean(includeRawItem, false);
    	var includeBase64 = gs_toBoolean(includeContentBase64, true);
    	var includeMetadata = gs_toBoolean(includeMetadata, true);
    	var requestedItemId = gs_require("itemId", itemId);
    	if (String(requestedItemId).toLowerCase() === "root") {
    		throw new java.lang.IllegalArgumentException("Downloading drive root is not allowed. Provide a file item id.");
    	}
    
    	var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    	var resolvedDriveData = gs_resolveDrive(tokenInfo.token, resolvedSite, driveId, driveName, listId, listName);
    	var resolvedDrive = resolvedDriveData.drive;
    	var resolvedList = resolvedDriveData.list;
    
    	var metadata = {};
    	if (includeMetadata) {
    		var metadataRequestInfo = gs_graphDriveItemGetRequestInfo(tokenInfo.token, resolvedDrive.driveId, requestedItemId);
    		gs_graphAddQueryParameter(metadataRequestInfo, "$select", "id,name,size,webUrl,eTag,cTag,createdDateTime,lastModifiedDateTime,file,folder,parentReference,createdBy,lastModifiedBy,fileSystemInfo,sharepointIds");
    		metadata = gs_normalizeDriveItem(gs_graphGetJsonRequestInfo(metadataRequestInfo, tokenInfo.token), includeRaw);
    	}
    
    	var contentRequestInfo = gs_graphDriveItemContentGetRequestInfo(tokenInfo.token, resolvedDrive.driveId, requestedItemId);
    	var download = gs_graphGetBytesRequestInfo(contentRequestInfo, tokenInfo.token);
    	if (download.statusCode < 200 || download.statusCode >= 300) {
    		throw new java.lang.RuntimeException("Graph download failed (" + download.statusCode + "): " + download.errorBody);
    	}
    
    	var contentBytes = download.bytes === null ? java.lang.reflect.Array.newInstance(java.lang.Byte.TYPE, 0) : download.bytes;
    	var contentLength = contentBytes.length;
    	var contentBase64 = includeBase64 ? java.util.Base64.getEncoder().encodeToString(contentBytes) : "";
    
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		siteId: resolvedSite.siteId,
    		siteHostname: resolvedSite.siteHostname,
    		sitePath: resolvedSite.sitePath,
    		driveId: resolvedDrive.driveId,
    		driveName: resolvedDrive.driveName,
    		driveWebUrl: resolvedDrive.driveWebUrl,
    		driveType: resolvedDrive.driveType,
    		sharepointIds: resolvedDrive.sharepointIds,
    		quota: resolvedDrive.quota,
    		owner: resolvedDrive.owner,
    		resolvedFromList: resolvedList !== null,
    		listId: resolvedList === null ? "" : resolvedList.listId,
    		listName: resolvedList === null ? "" : resolvedList.listName,
    		listDisplayName: resolvedList === null ? "" : resolvedList.listDisplayName,
    		listWebUrl: resolvedList === null ? "" : resolvedList.listWebUrl,
    		listInfo: resolvedList === null ? {} : resolvedList.listInfo,
    		listSharepointIds: resolvedList === null ? {} : resolvedList.sharepointIds,
    		query: {
    			itemId: requestedItemId,
    			includeContentBase64: includeBase64,
    			includeMetadata: includeMetadata,
    			includeRawItem: includeRaw
    		},
    		contentLength: contentLength,
    		contentType: download.contentType,
    		contentDisposition: download.contentDisposition,
    		contentLengthHeader: download.contentLengthHeader,
    		contentBase64: contentBase64,
    		item: metadata
    	});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
