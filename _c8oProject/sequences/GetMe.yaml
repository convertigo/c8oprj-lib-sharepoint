accessibility: Private
authenticatedContextRequired: true
comment: Reads the profile of the user of a delegated token (GET /me), to check that Microsoft Graph accepts the token. Microsoft Graph only. (Graph permissions User.Read)
↓inputVars [steps.InputVariablesStep-1799700000003]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteGetMe [steps.SimpleStep-1799700000004]: 
  comment: Calls GET /me with the delegated token.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "get_me";
    var requiredPermission = "User.Read";
    var tokenMode = "delegated";
    response = null;
    try {
    	var token = gs_require("accessToken", accessToken);
    	var me = gs_graphGetJson(gs_graphMeUrl(token, "id,displayName,userPrincipalName,mail"), token);
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		id: gs_safeString(me.id),
    		displayName: gs_safeString(me.displayName),
    		userPrincipalName: gs_safeString(me.userPrincipalName),
    		mail: gs_safeString(me.mail)
    	});
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }
    json = gs_toBoolean(jsonOutput, false) ? JSON.stringify(response) : null;'
