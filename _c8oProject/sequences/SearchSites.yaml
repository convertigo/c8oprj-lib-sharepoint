accessibility: Private
authenticatedContextRequired: true
comment: 'Searches the SharePoint sites whose name matches (GET /sites?search=), only the sites the token reaches; with includeFollowed, the sites the user follows and the root site first, the search failing (Microsoft Search, 500 on some tenants) answered in searchFailed. Microsoft Graph only. (Graph permissions Sites.Read.All|Sites.ReadWrite.All)'
↓inputVars [steps.InputVariablesStep-1799700000015]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteSearchSites [steps.SimpleStep-1799700000016]: 
  comment: Calls GET /sites?search= and follows its pages up to maxPages.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "search_sites";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var limitPages = gs_parseInteger("maxPages", maxPages, 1);
    	if (limitPages < 1) {
    		limitPages = 1;
    	}
    	if (limitPages > 20) {
    		limitPages = 20;
    	}
    	var fields = gs_splitCsv(selectFields);
    	if (fields.length === 0) {
    		fields = ["id", "name", "displayName", "webUrl"];
    	}
    	var searchText = gs_defaultString(search, "*").substring(0, 200);
    	if (gs_toBoolean(includeFollowed, false)) {
    		var sites = gs_sitesOfUser(tokenInfo.token, searchText, fields, limitPages);
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			search: searchText,
    			count: sites.items.length,
    			followed: sites.followed,
    			searchFailed: sites.searchFailed,
    			items: sites.items
    		});
    	}
    	else {
    		var pageResult = gs_graphCollectPagedValues(gs_graphSitesSearchUrl(tokenInfo.token, searchText, fields), tokenInfo.token, limitPages);
    		var items = [];
    		var i;
    		for (i = 0; i < pageResult.values.length; i++) {
    			items.push(gs_normalizeSite(pageResult.values[i], "", ""));
    		}
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			search: searchText,
    			count: items.length,
    			pagesFetched: pageResult.pagesFetched,
    			hasMore: !gs_isBlank(pageResult.nextLink),
    			nextLink: gs_safeString(pageResult.nextLink),
    			items: items
    		});
    	}
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }
    json = gs_toBoolean(jsonOutput, false) ? JSON.stringify(response) : null;'
