↓ExecuteCreateGraphSubscription [steps.SimpleStep-1772711623492]: 
  comment: Creates one Graph subscription and returns subscription metadata.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "create_graph_subscription";
    var requiredPermission = "DependsOnResource";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    tokenMode = tokenInfo.mode;
    
    var requestedResource = gs_require("resource", resource);
    var requestedChangeType = gs_defaultString(changeType, "updated");
    var requestedNotificationUrl = gs_require("notificationUrl", notificationUrl);
    var requestedExpirationDateTime = gs_require("expirationDateTime", expirationDateTime);
    var includeResourceDataFlag = gs_toBoolean(includeResourceData, false);
    
    var payload = {
    	changeType: requestedChangeType,
    	notificationUrl: requestedNotificationUrl,
    	resource: requestedResource,
    	expirationDateTime: requestedExpirationDateTime
    };
    if (!gs_isBlank(clientState)) {
    	payload.clientState = String(clientState);
    }
    if (!gs_isBlank(latestSupportedTlsVersion)) {
    	payload.latestSupportedTlsVersion = String(latestSupportedTlsVersion);
    }
    if (includeResourceDataFlag) {
    	payload.includeResourceData = true;
    	payload.encryptionCertificate = gs_require("encryptionCertificate", encryptionCertificate);
    	payload.encryptionCertificateId = gs_require("encryptionCertificateId", encryptionCertificateId);
    }
    
    var requestInfo = gs_graphSubscriptionsPostRequestInfo(tokenInfo.token);
    var created = gs_graphPostJsonRequestInfo(requestInfo, tokenInfo.token, payload, null);
    response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    	subscriptionId: gs_safeString(created.id),
    	resource: gs_safeString(created.resource),
    	changeType: gs_safeString(created.changeType),
    	notificationUrl: gs_safeString(created.notificationUrl),
    	expirationDateTime: gs_safeString(created.expirationDateTime),
    	clientState: gs_safeString(created.clientState),
    	latestSupportedTlsVersion: gs_safeString(created.latestSupportedTlsVersion),
    	query: {
    		includeResourceData: includeResourceDataFlag
    	},
    	subscription: created
    });
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'
