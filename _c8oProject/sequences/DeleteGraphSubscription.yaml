↓ExecuteDeleteGraphSubscription [steps.SimpleStep-1772711626653]: 
  comment: Deletes one Graph subscription by id.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "delete_graph_subscription";
    var requiredPermission = "DependsOnResource";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    tokenMode = tokenInfo.mode;
    
    var requestedSubscriptionId = gs_require("subscriptionId", subscriptionId);
    var requestInfo = gs_graphSubscriptionDeleteRequestInfo(tokenInfo.token, requestedSubscriptionId);
    var deleteResult = gs_graphDeleteRequestInfo(requestInfo, tokenInfo.token);
    if (deleteResult.statusCode !== 204 && deleteResult.statusCode !== 202 && deleteResult.statusCode !== 200) {
    	throw new java.lang.RuntimeException("Graph delete subscription failed (" + deleteResult.statusCode + "): " + deleteResult.body);
    }
    
    response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    	subscriptionId: requestedSubscriptionId,
    	statusCode: deleteResult.statusCode,
    	requestId: deleteResult.requestId,
    	clientRequestId: deleteResult.clientRequestId
    });
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'
