↓ExecuteUpdateListItem [steps.SimpleStep-1772620911002]: 
  comment: Resolves site and list then updates list item fields through provider-specific API.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "update_list_item";
    var requiredPermission = "Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremUpdateListItem({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			listId: listId,
    			listName: listName,
    			itemId: itemId,
    			fieldsJson: fieldsJson,
    			ifMatch: "*",
    			returnUpdatedItem: returnUpdatedItem,
    			selectFields: selectFields,
    			expandFieldValuesAsText: false,
    			includeRawItem: includeRawItem,
    			accessToken: accessToken,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    		var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		tokenMode = tokenInfo.mode;
    
    		var targetItemId = String(gs_require("itemId", itemId)).trim();
    		if (targetItemId.length > 1 && targetItemId.charAt(0) === "\"" && targetItemId.charAt(targetItemId.length - 1) === "\"") {
    			targetItemId = targetItemId.substring(1, targetItemId.length - 1);
    		}
    		if (targetItemId.length === 0) {
    			throw new java.lang.IllegalArgumentException("itemId cannot be empty");
    		}
    		var fieldsObject = gs_parseJsonObject("fieldsJson", fieldsJson);
    		var includeRaw = gs_toBoolean(includeRawItem, false);
    		var shouldReturnUpdatedItem = gs_toBoolean(returnUpdatedItem, true);
    		var selectedFields = gs_splitCsv(selectFields);
    
    		var resolved = gs_resolveSiteAndList(
    			tokenInfo.token,
    			siteId,
    			siteHostname,
    			sitePath,
    			listId,
    			listName
    		);
    
    		var patchRequestInfo = gs_graphSiteListItemFieldsPatchRequestInfo(tokenInfo.token, resolved.siteId, resolved.listId, targetItemId);
    		var updatedFields = gs_graphPatchJsonRequestInfo(patchRequestInfo, tokenInfo.token, fieldsObject);
    		var item = {
    			itemId: String(targetItemId),
    			fields: updatedFields
    		};
    
    		if (shouldReturnUpdatedItem) {
    			var getRequestInfo = gs_graphSiteListItemGetRequestInfo(tokenInfo.token, resolved.siteId, resolved.listId, targetItemId);
    			var expandValue = "fields";
    			if (selectedFields.length > 0) {
    				expandValue = "fields($select=" + selectedFields.join(",") + ")";
    			}
    			gs_graphAddQueryParameter(getRequestInfo, "$expand", expandValue);
    			item = gs_normalizeItem(gs_graphGetJsonRequestInfo(getRequestInfo, tokenInfo.token), includeRaw);
    		} else if (includeRaw) {
    			item.raw = updatedFields;
    		}
    
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			siteId: resolved.siteId,
    			siteHostname: resolved.siteHostname,
    			sitePath: resolved.sitePath,
    			listId: resolved.listId,
    			listName: resolved.listName,
    			listDisplayName: resolved.listDisplayName,
    			listWebUrl: resolved.listWebUrl,
    			sharepointIds: resolved.sharepointIds,
    			listInfo: resolved.listInfo,
    			query: {
    				itemId: targetItemId,
    				returnUpdatedItem: shouldReturnUpdatedItem,
    				selectFields: selectedFields,
    				includeRawItem: includeRaw
    			},
    			item: item
    		});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
