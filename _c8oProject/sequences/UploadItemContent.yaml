↓ExecuteUploadDriveItemContent [steps.SimpleStep-1772719801969]: 
  comment: Resolves site and drive then uploads file content to a new or existing drive item.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "upload_drive_item_content";
    var requiredPermission = "Files.ReadWrite.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremUploadDriveItemContent({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			driveId: driveId,
    			driveName: driveName,
    			listId: listId,
    			listName: listName,
    			itemId: itemId,
    			parentItemId: parentItemId,
    			fileName: fileName,
    			contentBase64: contentBase64,
    			contentType: contentType,
    			returnUploadedItem: returnUploadedItem,
    			selectFields: selectFields,
    			includeRawItem: includeRawItem,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    
    	var includeRaw = gs_toBoolean(includeRawItem, false);
    	var shouldReturnUploadedItem = gs_toBoolean(returnUploadedItem, true);
    	var selectedFields = gs_splitCsv(selectFields);
    	var explicitItemId = gs_safeString(itemId);
    	var requestedParentId = gs_safeString(parentItemId);
    	var normalizedParentId = gs_isBlank(requestedParentId) ? "root" : requestedParentId;
    	var targetFileName = gs_safeString(fileName);
    	var binaryContent = gs_decodeBase64("contentBase64", contentBase64);
    	var resolvedContentType = gs_defaultString(contentType, "application/octet-stream");
    
    	var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    	var resolvedDriveData = gs_resolveDrive(tokenInfo.token, resolvedSite, driveId, driveName, listId, listName);
    	var resolvedDrive = resolvedDriveData.drive;
    	var resolvedList = resolvedDriveData.list;
    
    	var uploadTarget = "";
    	var uploadRequestInfo = null;
    	if (!gs_isBlank(explicitItemId)) {
    		if (String(explicitItemId).toLowerCase() === "root") {
    			throw new java.lang.IllegalArgumentException("Uploading on drive root is not allowed. Provide a file item id.");
    		}
    		uploadTarget = "item";
    		uploadRequestInfo = gs_graphDriveItemContentPutRequestInfo(tokenInfo.token, resolvedDrive.driveId, explicitItemId, binaryContent);
    	} else {
    		targetFileName = gs_require("fileName", fileName).trim();
    		if (targetFileName.length === 0) {
    			throw new java.lang.IllegalArgumentException("fileName cannot be empty");
    		}
    		uploadTarget = "parent";
    		uploadRequestInfo = gs_graphDrivePathContentPutRequestInfo(tokenInfo.token, resolvedDrive.driveId, requestedParentId, targetFileName, binaryContent);
    	}
    
    	var uploadedItem = gs_normalizeDriveItem(gs_graphPutBinaryRequestInfo(uploadRequestInfo, tokenInfo.token, binaryContent, resolvedContentType), includeRaw);
    	var uploadedItemId = gs_safeString(uploadedItem.itemId);
    	if (shouldReturnUploadedItem) {
    		var targetUploadedItemId = gs_require("uploadedItemId", uploadedItemId);
    		var getRequestInfo = gs_graphDriveItemGetRequestInfo(tokenInfo.token, resolvedDrive.driveId, targetUploadedItemId);
    		if (selectedFields.length > 0) {
    			gs_graphAddQueryParameter(getRequestInfo, "$select", selectedFields.join(","));
    		}
    		uploadedItem = gs_normalizeDriveItem(gs_graphGetJsonRequestInfo(getRequestInfo, tokenInfo.token), includeRaw);
    	}
    
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		siteId: resolvedSite.siteId,
    		siteHostname: resolvedSite.siteHostname,
    		sitePath: resolvedSite.sitePath,
    		driveId: resolvedDrive.driveId,
    		driveName: resolvedDrive.driveName,
    		driveWebUrl: resolvedDrive.driveWebUrl,
    		driveType: resolvedDrive.driveType,
    		sharepointIds: resolvedDrive.sharepointIds,
    		quota: resolvedDrive.quota,
    		owner: resolvedDrive.owner,
    		resolvedFromList: resolvedList !== null,
    		listId: resolvedList === null ? "" : resolvedList.listId,
    		listName: resolvedList === null ? "" : resolvedList.listName,
    		listDisplayName: resolvedList === null ? "" : resolvedList.listDisplayName,
    		listWebUrl: resolvedList === null ? "" : resolvedList.listWebUrl,
    		listInfo: resolvedList === null ? {} : resolvedList.listInfo,
    		listSharepointIds: resolvedList === null ? {} : resolvedList.sharepointIds,
    		query: {
    			uploadTarget: uploadTarget,
    			itemId: explicitItemId,
    			parentItemId: normalizedParentId,
    			fileName: targetFileName,
    			contentType: resolvedContentType,
    			contentBytes: binaryContent.length,
    			returnUploadedItem: shouldReturnUploadedItem,
    			selectFields: selectedFields,
    			includeRawItem: includeRaw
    		},
    		item: uploadedItem
    	});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
