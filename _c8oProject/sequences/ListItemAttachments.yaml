accessibility: Private
authenticatedContextRequired: true
comment: 'Lists the attachments of a list item through the SharePoint REST API of SharePoint Online (Graph does not give them): their file names and server relative URLs, to read with DownloadFile. (SharePoint permission AllSites.Read)'
↓inputVars [steps.InputVariablesStep-1799700001006]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteListItemAttachments [steps.SimpleStep-1799700001007]: 
  comment: Calls GET /_api/web/lists(guid)/items(id)/AttachmentFiles with the delegated token of the site host.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "list_item_attachments";
    var requiredPermission = "AllSites.Read";
    var tokenMode = "delegated";
    response = null;
    try {
    	var token = gs_require("accessToken", accessToken);
    	var site = gs_restSiteUrl(siteUrl);
    	var answer = gs_restGetJson(gs_restAttachmentsUrl(site, listId, itemId), token);
    	var values = answer.value instanceof Array ? answer.value : [];
    	var files = [];
    	var i;
    	for (i = 0; i < values.length; i++) {
    		files.push({ fileName: gs_safeString(values[i].FileName), serverRelativeUrl: gs_safeString(values[i].ServerRelativeUrl) });
    	}
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		siteUrl: site,
    		listId: gs_safeString(listId),
    		itemId: gs_safeString(itemId),
    		count: files.length,
    		files: files
    	});
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }
    json = gs_toBoolean(jsonOutput, false) ? JSON.stringify(response) : null;'
