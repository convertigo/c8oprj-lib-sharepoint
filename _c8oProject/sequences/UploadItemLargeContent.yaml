    		resolved = maximumChunkSize;
    	}
    	if ((resolved % minimumChunkSize) !== 0) {
    		throw new java.lang.IllegalArgumentException("chunkSize must be a multiple of 327680 bytes");
    	}
    	return resolved;
    };
    
