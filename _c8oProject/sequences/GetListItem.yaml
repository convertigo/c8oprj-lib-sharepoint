↓ExecuteGetListItem [steps.SimpleStep-1772620902002]: 
  comment: Resolves site and list then retrieves one list item with optional field projection.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "get_list_item";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremGetListItem({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			listId: listId,
    			listName: listName,
    			itemId: itemId,
    			selectFields: selectFields,
    			includeRawItem: includeRawItem,
    			accessToken: accessToken,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    		var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		tokenMode = tokenInfo.mode;
    
    		var targetItemId = gs_require("itemId", itemId);
    		var includeRaw = gs_toBoolean(includeRawItem, false);
    		var selectedFields = gs_splitCsv(selectFields);
    
    		var resolved = gs_resolveSiteAndList(
    			tokenInfo.token,
    			siteId,
    			siteHostname,
    			sitePath,
    			listId,
    			listName
    		);
    
    		var requestInfo = gs_graphSiteListItemGetRequestInfo(tokenInfo.token, resolved.siteId, resolved.listId, targetItemId);
    		var expandValue = "fields";
    		if (selectedFields.length > 0) {
    			expandValue = "fields($select=" + selectedFields.join(",") + ")";
    		}
    		gs_graphAddQueryParameter(requestInfo, "$expand", expandValue);
    
    		var itemObject = gs_graphGetJsonRequestInfo(requestInfo, tokenInfo.token);
    		var item = gs_normalizeItem(itemObject, includeRaw);
    
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			siteId: resolved.siteId,
    			siteHostname: resolved.siteHostname,
    			sitePath: resolved.sitePath,
    			listId: resolved.listId,
    			listName: resolved.listName,
    			listDisplayName: resolved.listDisplayName,
    			listWebUrl: resolved.listWebUrl,
    			sharepointIds: resolved.sharepointIds,
    			listInfo: resolved.listInfo,
    			query: {
    				itemId: targetItemId,
    				selectFields: selectedFields,
    				includeRawItem: includeRaw
    			},
    			item: item
    		});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
