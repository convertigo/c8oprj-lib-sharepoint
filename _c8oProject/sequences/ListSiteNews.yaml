accessibility: Private
authenticatedContextRequired: true
comment: 'Lists the news of a SharePoint site (its pages promoted as news), the newest first, maxItems at most: for each one a whole number key (from its page id), its page id, title, description and date; with withContent, its text (the HTML of its text web parts, cleaned, without image nor link) and its image (the file of a library of the site its thumbnail is: driveId, itemId, name, size; null for an image of another host or the default thumbnail), so that an application can hold the news instead of the site. Microsoft Graph only. (Graph permissions Sites.Read.All|Sites.ReadWrite.All)'
↓inputVars [steps.InputVariablesStep-1799700002140]: 
  comment: Exposes request inputs in XML for debugging and source mapping.
↓ExecuteListSiteNews [steps.SimpleStep-1799700002141]: 
  comment: Lists the news pages of the site, then reads the text and the image of each one.
  expression: |
    'include("js/sharepoint_graph_common.js");
    include("js/sharepoint_page_content.js");
    
    var graphOperation = "site_news";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    	var site = gs_isBlank(siteId) ? gs_resolveSite(tokenInfo.token, "", siteHostname, sitePath).siteId : String(siteId);
    	var limitItems = gs_parseInteger("maxItems", maxItems, 50);
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, gs_siteNews(tokenInfo.token, site, {
    		withContent: gs_toBoolean(withContent, false),
    		maxItems: limitItems < 1 ? 1 : (limitItems > 100 ? 100 : limitItems)
    	}));
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }
    json = gs_toBoolean(jsonOutput, false) ? JSON.stringify(response) : null;'
