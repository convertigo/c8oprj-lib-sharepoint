  comment: Resolves delegated token fallback or acquires app-only token from Microsoft Entra ID.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var gs_decodeJwtPayload = function(jwtToken) {
    	if (gs_isBlank(jwtToken)) {
    		return null;
    	}
    	var parts = String(jwtToken).split(".");
    	if (parts.length < 2 || gs_isBlank(parts[1])) {
    		return null;
    	}
    	try {
    		var decoded = String(parts[1]).split("-").join("+").split("_").join("/");
    		while (decoded.length % 4 !== 0) {
    			decoded += "=";
    		}
    		var bytes = java.util.Base64.getDecoder().decode(decoded);
    		return JSON.parse(String(new java.lang.String(bytes, "UTF-8")));
    	} catch (ignoreJwtDecode) {
    		return null;
    	}
    };
    
    var graphOperation = "get_access_token";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    
    	var includePayload = gs_toBoolean(includeTokenPayload, true);
    	var tokenPayload = includePayload ? gs_decodeJwtPayload(tokenInfo.token) : null;
    	var payloadScopes = tokenPayload && !gs_isBlank(tokenPayload.scp) ? String(tokenPayload.scp).split(" ") : [];
    	var payloadRoles = [];
    	if (tokenPayload && tokenPayload.roles !== undefined && tokenPayload.roles !== null) {
    		if (tokenPayload.roles instanceof Array) {
    			payloadRoles = tokenPayload.roles;
    		} else {
    			payloadRoles = [String(tokenPayload.roles)];
    		}
    	}
    
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		token: tokenInfo.token,
    		tokenType: gs_defaultString(tokenInfo.tokenType, "Bearer"),
    		expiresIn: tokenInfo.expiresIn,
    		scope: gs_safeString(tokenInfo.scope),
    		tokenPreview: tokenInfo.token.length > 20 ? tokenInfo.token.substring(0, 20) + "..." : tokenInfo.token,
    		tokenPayload: tokenPayload === null ? {} : {
    			aud: gs_safeString(tokenPayload.aud),
    			tenantId: gs_safeString(tokenPayload.tid),
    			appId: gs_safeString(tokenPayload.appid),
    			upn: gs_safeString(tokenPayload.upn),
    			expiresAtEpoch: tokenPayload.exp === undefined || tokenPayload.exp === null ? "" : String(tokenPayload.exp),
    			scopes: payloadScopes,
    			roles: payloadRoles
    		}
    	});
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'
