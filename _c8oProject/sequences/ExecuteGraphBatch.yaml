↓ExecuteExecuteGraphBatch [steps.SimpleStep-1772711627889]: 
  comment: Posts batch payload to Graph and returns normalized responses and error count.
  expression: |
    'include("js/sharepoint_graph_common.js");
    
    var graphOperation = "execute_graph_batch";
    var requiredPermission = "DependsOnBatchRequests";
    var tokenMode = "delegated_or_application";
    response = null;
    
    try {
    var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    tokenMode = tokenInfo.mode;
    
    var batchRequest = gs_parseJsonObject("batchJson", batchJson);
    if (!(batchRequest.requests instanceof Array) || batchRequest.requests.length === 0) {
    	throw new java.lang.IllegalArgumentException("batchJson.requests must be a non-empty array");
    }
    
    var includeRawFlag = gs_toBoolean(includeRawResponse, false);
    var requestInfo = gs_graphBatchPostRequestInfo(tokenInfo.token);
    var batchResponse = gs_graphPostJsonRequestInfo(requestInfo, tokenInfo.token, batchRequest, null);
    var responses = batchResponse.responses instanceof Array ? batchResponse.responses : [];
    
    var failedCount = 0;
    var i;
    for (i = 0; i < responses.length; i++) {
    	var statusCode = parseInt(String(responses[i].status), 10);
    	if (!isNaN(statusCode) && statusCode >= 400) {
    		failedCount++;
    	}
    }
    
    var payload = {
    	requestCount: batchRequest.requests.length,
    	responseCount: responses.length,
    	failedCount: failedCount,
    	responses: responses
    };
    if (includeRawFlag) {
    	payload.raw = batchResponse;
    }
    
    response = gs_responseOk(graphOperation, tokenMode, requiredPermission, payload);
    } catch (e) {
    	response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    }'
