  comment: Resolves site and drive then invites recipients on one drive item..
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "invite_drive_item_recipients";
    var requiredPermission = "Files.ReadWrite.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		supported: false,
    		fallbackStatus: "onprem_not_supported",
    		message: "Inviting drive item recipients is not supported for SharePoint on-prem in unified mode. Use provider=graph.",
    		query: {
    			itemId: gs_safeString(itemId),
    			recipientEmails: gs_splitCsv(recipientEmails),
    			recipientsCount: gs_splitCsv(recipientEmails).length,
    			roles: gs_splitCsv(rolesCsv),
    			messageProvided: !gs_isBlank(message),
    			requireSignIn: gs_toBoolean(requireSignIn, true),
    			sendInvitation: gs_toBoolean(sendInvitation, true),
    			expirationDateTimeProvided: !gs_isBlank(expirationDateTime),
    			retainInheritedPermissions: gs_toBoolean(retainInheritedPermissions, true),
    			includeRawPermission: gs_toBoolean(includeRawPermission, false)
    		},
    		inviteResponse: {
    			statusCode: 0,
    			hasValueArray: false
    		},
    		permissions: []
    	});
    } else {
    	try {
    		var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		tokenMode = tokenInfo.mode;
    
    		var targetItemId = gs_require("itemId", itemId);
    		if (String(targetItemId).toLowerCase() === "root") {
    			throw new java.lang.IllegalArgumentException("Inviting recipients on drive root is not allowed. Provide a child item id.");
    		}
    
    		var requestedRecipientEmails = gs_safeString(recipientEmails);
    		var requestedRecipientsJson = gs_safeString(recipientsJson);
    		var requestedRoles = gs_splitCsv(rolesCsv);
    		var requestedMessage = gs_safeString(message);
    		var requestedRequireSignIn = gs_toBoolean(requireSignIn, true);
    		var requestedSendInvitation = gs_toBoolean(sendInvitation, true);
    		var requestedExpiration = gs_safeString(expirationDateTime);
    		var requestedRetainInherited = gs_toBoolean(retainInheritedPermissions, true);
    		var includeRaw = gs_toBoolean(includeRawPermission, false);
    
    		if (requestedRoles.length === 0) {
    			requestedRoles = ["read"];
    		}
    
    		var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    		var resolvedDriveData = gs_resolveDrive(tokenInfo.token, resolvedSite, driveId, driveName, listId, listName);
    		var resolvedDrive = resolvedDriveData.drive;
    		var resolvedList = resolvedDriveData.list;
    
    		var recipients = [];
    		if (!gs_isBlank(requestedRecipientsJson)) {
    			var parsedRecipients = null;
    			try {
    				parsedRecipients = JSON.parse(requestedRecipientsJson);
    			} catch (parseRecipientsError) {
    				throw new java.lang.IllegalArgumentException("Invalid JSON for recipientsJson: " + gs_safeString(parseRecipientsError.message));
    			}
    			if (!(parsedRecipients instanceof Array)) {
    				throw new java.lang.IllegalArgumentException("recipientsJson must be a JSON array");
    			}
    			var r;
    			for (r = 0; r < parsedRecipients.length; r++) {
    				var recipientEntry = parsedRecipients[r];
    				if (recipientEntry === null || recipientEntry === undefined) {
    					continue;
    				}
    				if (typeof recipientEntry === "string") {
    					var recipientEmailFromString = String(recipientEntry).trim();
    					if (recipientEmailFromString.length > 0) {
    						recipients.push({ email: recipientEmailFromString });
    					}
    				} else {
    					var recipientEmail = gs_safeString(recipientEntry.email).trim();
    					if (recipientEmail.length === 0) {
    						recipientEmail = gs_safeString(recipientEntry.alias).trim();
    					}
    					if (recipientEmail.length > 0) {
    						recipients.push({ email: recipientEmail });
    					}
    				}
    			}
    		}
    
    		var csvRecipients = gs_splitCsv(requestedRecipientEmails);
    		var c;
    		for (c = 0; c < csvRecipients.length; c++) {
    			recipients.push({ email: String(csvRecipients[c]) });
    		}
    
    		if (recipients.length === 0) {
    			throw new java.lang.IllegalArgumentException("Provide recipientEmails and/or recipientsJson with at least one recipient");
    		}
    
    		var normalizedRoles = [];
    		var k;
    		for (k = 0; k < requestedRoles.length; k++) {
    			var roleValue = String(requestedRoles[k]).trim().toLowerCase();
    			if (roleValue.length > 0) {
    				normalizedRoles.push(roleValue);
    			}
    		}
    		if (normalizedRoles.length === 0) {
    			normalizedRoles.push("read");
    		}
    
    		var inviteObject = {
    			recipients: recipients,
    			roles: normalizedRoles,
    			requireSignIn: requestedRequireSignIn,
    			sendInvitation: requestedSendInvitation,
    			retainInheritedPermissions: requestedRetainInherited
    		};
    
    		if (!gs_isBlank(requestedMessage)) {
    			inviteObject.message = requestedMessage;
    		}
    		if (!gs_isBlank(requestedExpiration)) {
    			inviteObject.expirationDateTime = requestedExpiration;
    		}
    
    		var inviteRequestInfo = gs_graphDriveItemInviteRequestInfo(tokenInfo.token, resolvedDrive.driveId, targetItemId);
    		var inviteResponse = gs_graphPostRequestInfo(inviteRequestInfo, tokenInfo.token, inviteObject, null);
    		if (inviteResponse.statusCode < 200 || inviteResponse.statusCode >= 300) {
    			throw new java.lang.RuntimeException("Graph invite failed (" + inviteResponse.statusCode + "): " + inviteResponse.body);
    		}
    		if (gs_isBlank(inviteResponse.body)) {
    			throw new java.lang.RuntimeException("Graph invite returned empty body");
    		}
    		var inviteBody = JSON.parse(inviteResponse.body);
    		var permissionCandidates = [];
    		if (inviteBody.value instanceof Array) {
    			permissionCandidates = inviteBody.value;
    		} else if (inviteBody.id !== undefined && inviteBody.id !== null) {
    			permissionCandidates = [inviteBody];
    		}
    
    		var responsePermissions = [];
    		var p;
    		for (p = 0; p < permissionCandidates.length; p++) {
    			responsePermissions.push(gs_normalizePermission(permissionCandidates[p], includeRaw));
    		}
    
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			siteId: resolvedSite.siteId,
    			siteHostname: resolvedSite.siteHostname,
    			sitePath: resolvedSite.sitePath,
    			driveId: resolvedDrive.driveId,
    			driveName: resolvedDrive.driveName,
    			driveWebUrl: resolvedDrive.driveWebUrl,
    			driveType: resolvedDrive.driveType,
    			sharepointIds: resolvedDrive.sharepointIds,
    			quota: resolvedDrive.quota,
    			owner: resolvedDrive.owner,
    			resolvedFromList: resolvedList !== null,
    			listId: resolvedList === null ? "" : resolvedList.listId,
    			listName: resolvedList === null ? "" : resolvedList.listName,
    			listDisplayName: resolvedList === null ? "" : resolvedList.listDisplayName,
    			listWebUrl: resolvedList === null ? "" : resolvedList.listWebUrl,
    			listInfo: resolvedList === null ? {} : resolvedList.listInfo,
    			listSharepointIds: resolvedList === null ? {} : resolvedList.sharepointIds,
    			query: {
    				itemId: targetItemId,
    				recipientEmails: csvRecipients,
    				recipientsCount: recipients.length,
    				roles: normalizedRoles,
    				messageProvided: !gs_isBlank(requestedMessage),
    				requireSignIn: requestedRequireSignIn,
    				sendInvitation: requestedSendInvitation,
    				expirationDateTimeProvided: !gs_isBlank(requestedExpiration),
    				retainInheritedPermissions: requestedRetainInherited,
    				includeRawPermission: includeRaw
    			},
    			inviteResponse: {
    				statusCode: inviteResponse.statusCode,
    				hasValueArray: inviteBody.value instanceof Array
    			},
    			permissions: responsePermissions
    		});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
