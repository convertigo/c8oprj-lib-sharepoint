↓ExecuteListGetItems [steps.SimpleStep-1772620727748]: 
  comment: Calls provider-specific list items API with optional select/filter/orderby and pagination.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "list_items";
    var requiredPermission = "Sites.Read.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremListGetItems({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			listId: listId,
    			listName: listName,
    			top: top,
    			maxPages: maxPages,
    			orderByExpression: orderBy,
    			filterExpression: filter,
    			selectFields: selectFields,
    			expandFieldValuesAsText: expandFields,
    			includeRawItem: includeRawItem,
    			accessToken: accessToken,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    		var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    		tokenMode = tokenInfo.mode;
    
    		var pageTop = gs_parseInteger("top", top, 100);
    		if (pageTop < 1) {
    			pageTop = 1;
    		}
    		if (pageTop > 999) {
    			pageTop = 999;
    		}
    
    		var maxPageCount = gs_parseInteger("maxPages", maxPages, 20);
    		if (maxPageCount < 1) {
    			maxPageCount = 1;
    		}
    		if (maxPageCount > 100) {
    			maxPageCount = 100;
    		}
    
    		var includeRaw = gs_toBoolean(includeRawItem, false);
    		var shouldExpandFields = gs_toBoolean(expandFields, true);
    		var selectedFields = gs_splitCsv(selectFields);
    
    		var resolved = gs_resolveSiteAndList(
    			tokenInfo.token,
    			siteId,
    			siteHostname,
    			sitePath,
    			listId,
    			listName
    		);
    
    		var requestInfo = gs_graphSiteListItemsGetRequestInfo(tokenInfo.token, resolved.siteId, resolved.listId);
    		if (shouldExpandFields) {
    			var expandValue = "fields";
    			if (selectedFields.length > 0) {
    				expandValue = "fields($select=" + selectedFields.join(",") + ")";
    			}
    			gs_graphAddQueryParameter(requestInfo, "$expand", expandValue);
    		}
    		gs_graphAddQueryParameter(requestInfo, "$top", String(pageTop));
    		gs_graphAddQueryParameter(requestInfo, "$orderby", gs_safeString(orderBy));
    		gs_graphAddQueryParameter(requestInfo, "$filter", gs_safeString(filter));
    
    	var items = [];
    	var nextUrl = gs_requestInfoUrl(requestInfo);
    	var pageResult = gs_graphCollectPagedValues(nextUrl, tokenInfo.token, maxPageCount);
    	var pageValues = pageResult.values;
    	var pageCount = pageResult.pagesFetched;
    	nextUrl = pageResult.nextLink;
    	var i;
    	for (i = 0; i < pageValues.length; i++) {
    		items.push(gs_normalizeItem(pageValues[i], includeRaw));
    	}
    
    		response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    			siteId: resolved.siteId,
    			siteHostname: resolved.siteHostname,
    			sitePath: resolved.sitePath,
    			listId: resolved.listId,
    			listName: resolved.listName,
    			listDisplayName: resolved.listDisplayName,
    			listWebUrl: resolved.listWebUrl,
    			sharepointIds: resolved.sharepointIds,
    			listInfo: resolved.listInfo,
    			count: items.length,
    			pagesFetched: pageCount,
    			hasMore: !gs_isBlank(nextUrl),
    			nextLink: gs_safeString(nextUrl),
    			query: {
    				top: pageTop,
    				maxPages: maxPageCount,
    				orderBy: gs_safeString(orderBy),
    				filter: gs_safeString(filter),
    				selectFields: selectedFields,
    				expandFields: shouldExpandFields,
    				includeRawItem: includeRaw
    			},
    			items: items
    		});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
