↓ListGetItems [steps.SimpleStep-1757335816105]: 
  expression: |
    '// RhinoJS (e.g., in Convertigo / Rhino contexts)
    include("js/common.js");
    
    // ---- Imports
    var I = new JavaImporter(
      Packages.org.apache.hc.client5.http.classic.methods,
      Packages.org.apache.hc.client5.http.impl.classic,
      Packages.org.apache.hc.client5.http.auth,
      Packages.org.apache.hc.client5.http.config,
      Packages.org.apache.hc.client5.http.impl.auth,
      Packages.org.apache.hc.client5.http.protocol,
      Packages.org.apache.hc.client5.http,
      Packages.org.apache.hc.client5.http.cookie,
      Packages.org.apache.hc.client5.http.cookie.BasicCookieStore,
      Packages.org.apache.hc.client5.http.impl.cookie,
      Packages.org.apache.hc.client5.http.impl.routing,
      Packages.org.apache.hc.client5.http.impl.io,
      Packages.org.apache.hc.core5.http,
      Packages.org.apache.hc.core5.http.io.entity,
      Packages.org.apache.hc.core5.http.message,
      Packages.org.apache.hc.core5.util
    );
    
    
    
    with (I) {
      var client = Authenticate();
      
      // SharePoint REST endpoint for list items
      // Docs: https://<server>/<sitecollection>/<site>/_api/web/lists/getbytitle(''MyList'')/items
      
      var url = sharepointBase + "/_api/web/lists/getbytitle(''" + list + "'')/items"
      	+"?$select=*"
    	+"&$orderby=Id"
    	+"&$top=" + pageSize;
    	
    	data = [];
    	while (url) {	
    	  var get = new HttpGet(url);
    	  get.addHeader("Accept", "application/json;odata=nometadata"); // lean payload
    	
    	  var res = client.execute(get);
    	  var code = res.getCode();
    	  var body = org.apache.hc.core5.http.io.entity.EntityUtils.toString(res.getEntity());
    	
    	  if (code >= 200 && code < 300) {
    		log.warn("Response: " + body);
    	    var json = JSON.parse(body); // Rhino has JSON by default
    		var items = json.value || json.d && json.d.results || [];
    		for each (var it in items) data.push(it);
    		
    		// Next link can be @odata.nextLink or __next depending on payload style
     	    url = json[''odata.nextLink''] || (json.d && json.d.__next) || null;
    		log.warn("Next URL : " + url);
    	  } else {
    	    throw "HTTP " + code + " from SharePoint: " + body;
    	  }
      	}
    }
    '
