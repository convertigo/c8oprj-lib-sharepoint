↓ExecuteCopyDriveItem [steps.SimpleStep-1772719738944]: 
  comment: Resolves site and drive then starts one asynchronous drive item copy operation.
  expression: |
    'include("js/sharepoint_provider.js");
    include("js/sharepoint_graph_common.js");
    
    var graphOperation = "copy_drive_item";
    var requiredPermission = "Files.ReadWrite.All|Sites.ReadWrite.All";
    var tokenMode = "delegated_or_application";
    response = null;
    var requestedProvider = sppr_normalizeProvider(provider, "graph");
    
    if (requestedProvider === "onprem") {
    	tokenMode = "onprem";
    	try {
    		sppr_ensureOnPremDispatch();
    		response = sppr_onPremCopyDriveItem({
    			siteBaseUrl: siteBaseUrl,
    			siteHostname: siteHostname,
    			sitePath: sitePath,
    			onPremProtocol: onPremProtocol,
    			driveId: driveId,
    			driveName: driveName,
    			listId: listId,
    			listName: listName,
    			itemId: itemId,
    			destinationParentItemId: destinationParentItemId,
    			newName: newName,
    			includeMonitorResponse: includeMonitorResponse,
    			onPremUsername: onPremUsername,
    			onPremPassword: onPremPassword,
    			cookieHeader: cookieHeader
    		});
    	} catch (onPremError) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, onPremError);
    	}
    } else {
    	try {
    	var tokenInfo = gs_resolveToken(accessToken, tenantId, clientId, clientSecret);
    	tokenMode = tokenInfo.mode;
    
    	var targetItemId = gs_require("itemId", itemId);
    	if (String(targetItemId).toLowerCase() === "root") {
    		throw new java.lang.IllegalArgumentException("Copying drive root is not allowed. Provide a child item id.");
    	}
    
    	var requestedDestinationParent = gs_safeString(destinationParentItemId);
    	var requestedNewName = gs_safeString(newName);
    	var shouldIncludeMonitorResponse = gs_toBoolean(includeMonitorResponse, false);
    
    	if (gs_isBlank(requestedDestinationParent) && gs_isBlank(requestedNewName)) {
    		throw new java.lang.IllegalArgumentException("Provide destinationParentItemId and/or newName");
    	}
    
    	var resolvedSite = gs_resolveSite(tokenInfo.token, siteId, siteHostname, sitePath);
    	var resolvedDriveData = gs_resolveDrive(tokenInfo.token, resolvedSite, driveId, driveName, listId, listName);
    	var resolvedDrive = resolvedDriveData.drive;
    	var resolvedList = resolvedDriveData.list;
    
    	var copyObject = {};
    	var resolvedDestinationParentId = "";
    	if (!gs_isBlank(requestedDestinationParent)) {
    		resolvedDestinationParentId = requestedDestinationParent;
    		if (String(requestedDestinationParent).toLowerCase() === "root") {
    			resolvedDestinationParentId = gs_resolveRootItemId(tokenInfo.token, resolvedDrive.driveId);
    		}
    		if (gs_isBlank(resolvedDestinationParentId)) {
    			throw new java.lang.IllegalArgumentException("destinationParentItemId cannot resolve to empty value");
    		}
    		copyObject.parentReference = {
    			id: String(resolvedDestinationParentId)
    		};
    	}
    
    var normalizedName = "";
    if (!gs_isBlank(requestedNewName)) {
    	normalizedName = String(requestedNewName)
    		.split("[[timestamp]]")
    		.join(String(java.lang.System.currentTimeMillis()))
    		.trim();
    	if (normalizedName.length === 0) {
    		throw new java.lang.IllegalArgumentException("newName cannot be empty");
    	}
    	copyObject.name = normalizedName;
    }
    
    	var copyRequestInfo = gs_graphDriveItemCopyRequestInfo(tokenInfo.token, resolvedDrive.driveId, targetItemId);
    	var copyResponse = gs_graphPostRequestInfo(copyRequestInfo, tokenInfo.token, copyObject, null);
    	if (copyResponse.statusCode !== 202) {
    		throw new java.lang.RuntimeException("Graph copy request failed (" + copyResponse.statusCode + "): " + copyResponse.body);
    	}
    
    	var monitorUrl = gs_safeString(copyResponse.location);
    	var monitorData = {};
    	if (shouldIncludeMonitorResponse && !gs_isBlank(monitorUrl)) {
    		monitorData = gs_graphMonitorOperation(tokenInfo.token, monitorUrl, true, false);
    	}
    
    	response = gs_responseOk(graphOperation, tokenMode, requiredPermission, {
    		siteId: resolvedSite.siteId,
    		siteHostname: resolvedSite.siteHostname,
    		sitePath: resolvedSite.sitePath,
    		driveId: resolvedDrive.driveId,
    		driveName: resolvedDrive.driveName,
    		driveWebUrl: resolvedDrive.driveWebUrl,
    		driveType: resolvedDrive.driveType,
    		sharepointIds: resolvedDrive.sharepointIds,
    		quota: resolvedDrive.quota,
    		owner: resolvedDrive.owner,
    		resolvedFromList: resolvedList !== null,
    		listId: resolvedList === null ? "" : resolvedList.listId,
    		listName: resolvedList === null ? "" : resolvedList.listName,
    		listDisplayName: resolvedList === null ? "" : resolvedList.listDisplayName,
    		listWebUrl: resolvedList === null ? "" : resolvedList.listWebUrl,
    		listInfo: resolvedList === null ? {} : resolvedList.listInfo,
    		listSharepointIds: resolvedList === null ? {} : resolvedList.sharepointIds,
    		query: {
    			itemId: targetItemId,
    			destinationParentItemId: requestedDestinationParent,
    			resolvedDestinationParentItemId: resolvedDestinationParentId,
    			newName: requestedNewName,
    			includeMonitorResponse: shouldIncludeMonitorResponse
    		},
    		copyRequest: {
    			statusCode: copyResponse.statusCode,
    			monitorUrl: monitorUrl,
    			retryAfter: copyResponse.retryAfter,
    			requestId: copyResponse.requestId,
    			clientRequestId: copyResponse.clientRequestId,
    			normalizedName: normalizedName,
    			accepted: copyResponse.statusCode === 202
    		},
    		monitor: monitorData
    	});
    	} catch (e) {
    		response = gs_responseError(graphOperation, tokenMode, requiredPermission, e);
    	}
    }'
